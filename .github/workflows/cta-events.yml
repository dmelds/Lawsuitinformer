name: CTA Events

# Installs the outbound cta_click GA4 listener on every page. Dispatch only:
# run it from the Actions tab, read the dry-run summary in the log, then run
# again with apply = true. Nothing to type in the run dialog except the toggle.
#
# The script is idempotent, so a rerun on an already-swept tree is a no-op and
# reports zero files patched.
#
# The commit message carries [skip lastmod] and [skip actions] so the sitemap
# generator does not flatten every lastmod date onto the sweep day. This is a
# script-block change with no content change, so lastmod should not move.
#
# It also runs a dry run on the 1st of each month against staging. That run
# never writes anything; it fails on purpose when it finds pages missing the
# listener, so GitHub sends a notification. A clean month passes silently.

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes and commit (leave false for a dry run)'
        type: boolean
        default: false
      branch:
        description: 'Branch to commit to'
        type: string
        default: staging

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled runs carry no inputs, so fall back to the same default.
          ref: ${{ inputs.branch || 'staging' }}

      - name: Dry run
        run: python3 add_cta_events.py | tee /tmp/cta.log

      - name: Fail the monthly check if anything is missing the listener
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if grep -q '^  0 files patched' /tmp/cta.log; then
            echo "Every page carries the listener."
            exit 0
          fi
          echo "::error::Pages are missing the cta_click listener. Run this workflow with apply = true on staging."
          sed -n '1,6p' /tmp/cta.log
          exit 1

      - name: Apply
        if: ${{ inputs.apply }}
        run: python3 add_cta_events.py --apply

      - name: Check date consistency still passes
        if: ${{ inputs.apply }}
        run: python3 check_date_consistency.py --strict

      - name: Commit
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add '*.html'
          git commit -m "Install outbound cta_click listener sitewide [skip lastmod] [skip actions]"
          git pull --rebase
          git push
