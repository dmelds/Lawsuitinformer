name: Strip dead Clicky handlers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove clicky onclick handlers
        run: |
          python3 - << 'EOF'
          import re, pathlib
          pat = re.compile(r'\s+onclick="[^"]*clicky[^"]*"')
          files = total = 0
          for f in pathlib.Path('.').rglob('*.html'):
              s = f.read_text(encoding='utf-8')
              s2, n = pat.subn('', s)
              if n:
                  f.write_text(s2, encoding='utf-8')
                  files += 1
                  total += n
          print(f"{files} files, {total} handlers removed")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to strip."
            exit 0
          fi
          git add '*.html'
          git commit -m "Strip dead Clicky handlers [skip lastmod] [skip actions]"
          git push
