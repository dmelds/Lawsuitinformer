name: Check Cannibalization

# Pages in one cluster competing for one search. Added 10/4/26 after a hub
# rewrite pulled the updates page's job (case count, settlement appointments,
# court calendar) onto the hub and its description promised "where it stands";
# nothing in the repo said so. The checker flags shared body text between
# cluster pages, status language on pages that are not the cluster's updates
# page, live counts carried on more than one page, and duplicate titles or
# descriptions site-wide.
#
# CROSS-SITE, added 10/4/26 for Lawsuit Center and extended 10/5/26 to Lawsuit
# Intelligencer: the other two repos are checked out next to this one and
# every pair of sites is compared on the torts they share (shared body text,
# status promises, counts carried on more than one site, matching titles and
# descriptions). Pages that carry counts for many torts at once (the mass tort
# map on Intelligencer, the tort roundups here) are compared for counts
# against every page on the other sites, since they sit in no one cluster.
# Both other repos are public, so the checkouts need no token. If either is
# ever made private, add a repo secret with read access and pass it as
# `token:` on that step.
#
# GATE, switched on 10/4/26 once the Informer baseline reached zero errors.
# The Informer-only step runs with --strict, so a pull request that adds a
# new pair over the error line, or a duplicate title or description, fails.
# Warnings still print without failing the run.
#
# NETWORK GATE, 10/6/26. Center and Intelligencer now run this same script
# (from a checkout of this repo) on their own pull requests, strict against
# themselves and both other sites, so a page added on any of the three sites
# is checked on the pull request that adds it. With that in place and the
# cross-site baseline at zero errors on all three pairs, the cross-site steps
# here are strict too: a pair over the error line on any two sites fails this
# run. On a pull request that means an Informer PR can fail on a collision
# another site introduced; the daily run below will have reported that
# collision first, so a red PR here names a problem already on the list.
#
# DAILY, 10/6/26. The schedule moved from monthly to daily because this run
# is the only one that re-compares the three sites after edits land on main
# without a pull request. A failing run sends the GitHub failure email; a
# passing run sends nothing. Every step's output is also written to the run
# summary, so the findings read on the run page without opening the log.
# Steps run with !cancelled() so one failing step does not hide the others.
# The site profile is detected from each folder's canonical URLs, so --site
# is only needed if that detection ever fails.

on:
  pull_request:
    branches: [main]
    paths: ['**.html']
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cannibalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lawsuit Informer
        uses: actions/checkout@v7

      - name: Checkout Lawsuit Center
        uses: actions/checkout@v7
        with:
          repository: dmelds/lawsuits-center
          ref: main
          path: _center

      - name: Checkout Lawsuit Intelligencer
        uses: actions/checkout@v7
        with:
          repository: dmelds/lawsuitintelligencer
          ref: main
          path: _intelligencer

      - name: Check cannibalization, Informer (gate)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo '## Informer' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 check_cannibalization.py --strict 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Check cannibalization, all three sites against each other (gate)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo '## All three sites against each other' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 check_cannibalization.py --with _center --with _intelligencer --strict 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Check cannibalization, Lawsuit Center pages against each other (report)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo '## Lawsuit Center' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 check_cannibalization.py --path _center --site center 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Check cannibalization, Lawsuit Intelligencer pages against each other (report)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo '## Lawsuit Intelligencer' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 check_cannibalization.py --path _intelligencer --site intelligencer 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
