name: Generate Redirects

on:
  # Auto: runs when pages change on main. The job only commits _redirects
  # (not an .html file), so it never re-triggers itself.
  push:
    branches: [main]
    paths: ['**.html']
  # Manual: same dry-run option as the other workflows.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no commit)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate redirects
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python generate_redirects.py --dry-run
          else
            python generate_redirects.py
          fi

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to _redirects: a bare `git diff --quiet` also reports clean
          # when some other path is dirty, which would skip a real update.
          if git diff --quiet _redirects; then
            echo "No changes to commit (_redirects already up to date)"
            exit 0
          fi
          git add _redirects
          git commit -m "Auto-regenerate forced .html redirects (_redirects) [skip actions]"
          BRANCH="$(git branch --show-current)"
          # The three generators can finish within seconds of each other on the
          # same push. A single rebase-then-push loses whichever lands second,
          # so retry with backoff instead of failing the run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push; then
              echo "Pushed _redirects to $BRANCH on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep $(( attempt * 3 + RANDOM % 4 ))
          done
          echo "::error::Could not push _redirects after 5 attempts"
          exit 1
