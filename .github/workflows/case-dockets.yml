name: Case Dockets

# Surfaces case docket numbers in the title family of case pages, per the
# TITLES map at the top of add_case_dockets.py. Dispatch only: run it from the
# Actionsn tab with apply = false, read the before/after in the log, then run it
# again with apply = true.
#
# Idempotent, so a second apply is a no-op rather than a double edit. Safe to
# rerun if you are unsure whether the first run took.
#
# The commit message carries [skip lastmod] and [skip actions] so the sitemap
# generator does not stamp every page with today's date over a two-file change.
#
# To add a page later, edit the TITLES dict in add_case_dockets.py. Nothing in
# this file needs to change.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes and commit (leave false for a dry run)'
        type: boolean
        default: false
      branch:
        description: 'Branch to commit to'
        type: string
        default: staging

permissions:
  contents: write

jobs:
  dockets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'staging' }}

      - name: Dry run
        run: python3 add_case_dockets.py | tee dockets.log

      - name: Apply
        if: ${{ inputs.apply }}
        run: python3 add_case_dockets.py --apply

      - name: Check date consistency still passes
        if: ${{ inputs.apply }}
        run: python3 check_date_consistency.py --strict

      - name: Commit
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit — titles already carry their dockets."
            exit 0
          fi
          git add -A
          git commit -m "Surface case dockets in titles [skip lastmod] [skip actions]"
          git pull --rebase
          git push
