name: Check Title Freshness

on:
  # Gate: runs on every staging -> main PR that touches pages, and
  # blocks the merge if any title carries a stale Month YYYY stamp.
  pull_request:
    branches: [main]
    paths: ['**.html']
  # Rollover: the 1st of each month, 09:00 UTC. Catches titles that go
  # stale with no push at all — a failed run sends a GitHub notification.
  schedule:
    - cron: '0 9 1 * *'
  # Manual: run from the Actions tab anytime.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-title-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check title freshness
        run: python3 check_title_freshness.py --strict
