name: Signup boxes

# Puts the weekly-email signup box on the homepage and on every update page
# (add_signup_boxes.py). It runs when the script, the status board's page list
# or the newsletter function changes, and on demand. The script writes a page
# only when its box changed, so a run with nothing new commits nothing.
#
# The box is navigation, so the commit carries [skip lastmod]: no page's
# <lastmod>, dateModified or Last updated stamp moves for it. [skip actions]
# keeps the commit from re-triggering this or any other push workflow.
#
# The script fails the run when the status board's PAGES and the function's
# TOPICS disagree, so a reader can never tick a case the function would drop.
#
# 11/9/26: the commit step adds every page the script can write (the board's
# PAGES), so no box is left unstaged. Run #12 failed because the hernia mesh
# history page was written but not added, and the unstaged file blocked every
# pull --rebase. Each push attempt now also aborts a failed rebase first.

on:
  push:
    branches: [main]
    paths:
      - 'add_signup_boxes.py'
      - 'generate_status_board.py'
      - 'netlify/functions/newsletter.mjs'
      - '.github/workflows/signup-boxes.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list the pages that would change, write nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signup-boxes
  cancel-in-progress: false

jobs:
  boxes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Place the boxes
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python add_signup_boxes.py --dry-run
          else
            python add_signup_boxes.py
          fi

      - name: Check dates
        if: ${{ inputs.dry_run != true }}
        run: python check_date_consistency.py --strict

      - name: Commit if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html current-mass-tort-cases.html '*-update.html' '*-updates.html' openai-lawsuits.html transvaginal-mesh-litigation-update.html recent-developments-hernia-mesh-litigation.html
          if [ -n "$(git status --porcelain --untracked-files=no -- '*.html')" ] && ! git diff --quiet; then
            echo "::error::The script wrote pages this step does not add:"
            git diff --name-only
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Signup boxes unchanged."
            exit 0
          fi
          git commit -m "Add the weekly-email signup box [skip lastmod] [skip actions]"
          BRANCH="$(git branch --show-current)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying"
            sleep $(( attempt * 3 + RANDOM % 4 ))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
