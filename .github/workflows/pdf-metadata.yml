name: Normalize filing PDF metadata

# Manual only. Court filings change rarely, and a rewrite touches every
# byte of the file, so this should never fire on an ordinary push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only. Uncheck to write and commit."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pdf-metadata
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pikepdf
        run: pip install --quiet pikepdf

      - name: Normalize metadata
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: python set-pdf-metadata.py

      - name: Commit and push
        if: ${{ inputs.dry_run == false }}
        run: |
          if git diff --quiet -- case-filings; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-filings
          git commit -m "Normalize filing PDF metadata [skip lastmod] [skip actions]"
          git pull --rebase
          git push
