name: Swap OG image png -> jpg (one-shot)

# Manual only. Dispatch this from the Actions tab with the branch set to
# staging, review the result, then PR to main as usual. Delete this file
# once the swap has landed - it is not meant to stay in the repo.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview counts only, no commit)'
        type: boolean
        default: true
      delete_png:
        description: 'Also delete og-default.png'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Swap og-default.png -> og-default.jpg in HTML
        run: |
          python - <<'PY'
          import glob, sys

          OLD, NEW = "og-default.png", "og-default.jpg"
          # HTML only. _redirects also contains the string, and rewriting it
          # there would produce "/og-default.jpg /og-default.jpg 301!" - a
          # forced self-redirect, i.e. an infinite loop on that path.
          files = sorted(glob.glob("*.html") + glob.glob("es/*.html"))

          touched = hits = 0
          for f in files:
              s = open(f, encoding="utf-8").read()
              n = s.count(OLD)
              if not n:
                  continue
              open(f, "w", encoding="utf-8").write(s.replace(OLD, NEW))
              touched += 1
              hits += n

          print(f"files changed: {touched}")
          print(f"replacements:  {hits}")

          # Guard: every page carries the string twice (og:image, twitter:image).
          if touched and hits != touched * 2:
              print(f"::warning::expected {touched*2} replacements, got {hits}")
          if not touched:
              print("::error::no occurrences found - nothing to do")
              sys.exit(1)
          PY

      - name: Verify _redirects untouched
        run: |
          if ! grep -qF '/og-default.png  /og-default.jpg  301!' _redirects; then
            echo "::error::_redirects rule is missing or was modified"
            exit 1
          fi
          echo "_redirects rule intact"

      - name: Delete og-default.png
        if: ${{ inputs.delete_png }}
        run: |
          if [ -f og-default.png ]; then
            git rm --quiet og-default.png
            echo "removed og-default.png"
          else
            echo "og-default.png already gone"
          fi

      - name: Show diff summary
        run: git status --short | head -20; echo "..."; git diff --stat | tail -1

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "Point og:image and twitter:image at og-default.jpg [skip actions]"
          BRANCH="$(git branch --show-current)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push; then
              echo "Pushed to $BRANCH on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep $(( attempt * 3 + RANDOM % 4 ))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
